# studio v2 Rust core (plan: studio-v2-rmp.md, "Repo layout"). The toolchain is pinned in
# nix/rust.nix (rust-overlay, iOS targets included); enter it with `nix develop`.
[workspace]
resolver = "2"
members = [
  "crates/studio-core",
  "crates/studio-net",
  "crates/studio-media",
  "crates/studio-cli",
  "crates/stt",
  "crates/ffi",
]
# desktop/ is the Tauri shell with its own Cargo.lock; it stays its own workspace until slice 4.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }
age = "0.12"
toml = "0.9"
toml_edit = "0.25"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
gethostname = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
