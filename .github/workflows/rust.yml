# CI stub (plan task 0.5): the Rust workspace on x86_64-linux with the pinned nix toolchain
# (devShells.rust: toolchain only). Actions pinned to commit SHAs.
name: rust
on:
  push:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "nix/rust.nix", "flake.nix", "flake.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "nix/rust.nix", "flake.nix", "flake.lock", ".github/workflows/rust.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop .#rust --quiet -c cargo test --workspace --locked
      - run: nix develop .#rust --quiet -c cargo clippy --workspace --all-targets --locked -- -D warnings
